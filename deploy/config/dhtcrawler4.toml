# dhtcrawler4 configuration.
#
# Every key can be overridden with an environment variable named
#   DC4_<SECTION>__<KEY>        e.g.  DC4_DATABASE__USER=dc4_web
# List values are given as comma-separated strings in the environment.
# Secrets are never written here: point *_file keys at mounted secret files.

[database]
host = "db"
port = 5432
name = "dc4"
# Each role connects as its own least-privilege user (see deploy/docker-compose.yml).
user = "dc4_crawler"
password_file = "/run/secrets/db_password"
max_connections = 8

# Optional per-role credentials, used by `dhtcrawler4 all` (one pool per role).
# [database.crawler]
# user = "dc4_crawler"
# password_file = "/run/secrets/dc4_crawler_password"
# [database.indexer]
# user = "dc4_indexer"
# password_file = "/run/secrets/dc4_indexer_password"
# [database.web]
# user = "dc4_web"
# password_file = "/run/secrets/dc4_web_password"

[crawl]
# UDP port for the DHT. dhtcrawler4 never listens on TCP: it only dials peers.
dht_port = 6881
bind_v4 = "0.0.0.0"
# IPv6 DHT (BEP 32). Disabled automatically, with a warning, when the host has no
# global IPv6 address. Set to "" to disable it explicitly.
bind_v6 = "::"
# In-process DHT identities (1-8, default 1). Each binds `dht_port + i` per
# family with its own node ID and routing table, sharing everything else.
# With N > 1, publish/allow the whole port range (dht_port..dht_port+N-1).
identities = 1
bootstrap = [
  "dht.libtorrent.org:25401",
  "dht.transmissionbt.com:6881",
  "router.bt.ouinet.work:6881",
  "router.bittorrent.com:6881",
]
# Routing-table state (node ids, a few hundred contacts). Never contains peers.
state_dir = "/var/lib/dhtcrawler4"
# Global outbound DHT packet budget. Sized for a server; lower it on a
# home connection. Politeness toward any single node comes from the 1 s
# per-address query spacing, so this aggregate only bounds total wire bytes
# (~6 MB/s total at full reply rate: ~1.2 out + ~4.8 in at typical
# response sizes).
max_packets_per_sec = 12000
# Sampler workers (one query each at a time): timeout-bound mixes sustain
# roughly concurrency / 2 s sends (sampler queries time out after 2 s),
# so this floors worst-case discovery.
sampler_concurrency = 1024
# Fraction of sampler picks that probe a live address directly instead of
# traversing the frontier (0.0-1.0; 0 disables). Live stores skew toward
# live swarms; uniform-node samples are mostly dead. A reallocation inside
# existing budgets, not additional traffic.
sampler_live_share = 0.25
# Answer no DHT queries and mark ours read-only (BEP 43). Leave false to be a
# full, reciprocating DHT node.
read_only = false
fetch_workers = 6144
max_connections = 24576
max_metadata_bytes = 8388608
# Total metadata bytes held by all fetches at once (memory bound).
max_inflight_metadata_bytes = 1073741824
# Keys waiting for metadata. Above this, only sampled and announced keys are queued.
max_pending = 5000000
# BEP 33 seeder scrapes: dedicated workers re-poll stored torrents for their
# current seeder count and tombstone dead swarms. Defaults keep up with ~100k
# torrents; without the node-list cache a million torrents need a higher
# scrape_packets_per_sec (see the sizing note in docs, bep33.md §6).
scrape_workers = 1
# Minimum age of an estimate before a row is re-scraped (7 days).
scrape_interval_secs = 604800
# Rows claimed per scrape round.
scrape_batch = 64
# Consecutive dead scrapes before a tombstone.
max_scrape_failures = 2
# A swarm is dead when its seeder estimate is at most this.
scrape_seeder_threshold = 0
# Per-RPC timeout of scrape queries (BEP 33 guidance).
scrape_query_timeout_secs = 10
# Overall deadline of one scrape lookup; must exceed the per-RPC timeout.
scrape_lookup_timeout_secs = 60
# In-flight scrape lookups per worker.
scrape_concurrency = 3
# Dedicated outbound packet budget for scrapes (burst: 1s), kept far below
# the crawl bucket so scrapes never starve discovery.
scrape_packets_per_sec = 100
# Dedicated outbound packet budget for fetch traversals (burst: 1s).
# Fetch runs ~2,000 lookups/s measured, so 6000 gives ~3x headroom; fetch
# alone can never be the binding constraint. Total default egress is
# 12k main + 6k fetch + 100 scrape (~18.1k, up ~6k/s over the old
# 12k-only envelope).
fetch_packets_per_sec = 6000
# UDP tracker hybrid: scrape triage plus one-shot announces for
# triage-positive keys. Enabled by default; false means DHT-only fetch and
# no tracker sockets. Announcements expose our IP per hash to tracker
# operators (same exposure class as DHT participation): `started`-only, a
# random subset per key, no hammering.
tracker_enabled = true
# Explicit trackers, one per line. Non-empty replaces the vendored list.
# trackers = [
#   "udp://tracker.example:6969/announce",
# ]
# Tracker list URL for refresh (plain HTTP only: no TLS client, so https
# is rejected at validation — point it at an http:// mirror to enable).
# Empty disables refresh: vendored snapshot plus explicit list only.
tracker_list_url = ""
# Seconds between list refreshes.
tracker_list_refresh_secs = 86400
# Random live trackers announced per triage-positive key.
tracker_announces_per_key = 5
# Random live trackers scraped per triage batch.
tracker_scrape_fanout = 3
# Pool-wide tracker packet budget.
tracker_packets_per_sec = 200
# Per-RPC timeout of tracker queries.
tracker_timeout_secs = 5
# Base admission cooldown of a removed key, in days; repeats escalate
# 7 -> 30 -> 90 days (the cap is not a knob).
removal_cooldown_days = 7
# Grace before a tombstoned row is hard-purged, in hours.
tombstone_purge_hours = 1
# Age before a gave-up queue row is hard-purged, in hours. Gave-up rows count
# against max_pending without ever becoming claimable again, so this must stay
# short enough that corpses leave faster than failures arrive.
gave_up_purge_hours = 1
# Interval of the tombstone-purge sweep, in seconds.
scrape_sweep_secs = 3600
# Re-scrape interval of rows whose swarm is still unknown (30 days): unknown
# rows cost lookups without answers, so they are re-polled less often. Must
# be at least scrape_interval_secs.
scrape_unknown_interval_secs = 2592000
# LRU size of the node-list cache reused as scrape start set; 0 disables.
scrape_node_cache_keys = 4096
# Agreeing nonzero responses that end a traversal early (live-only: a dead
# verdict always requires the full traversal over both families).
scrape_early_exit_quorum = 3
# Pin the BEP 42 r value (0-7) so replicas on one IP hold distinct IDs.
# Leave commented for a random r.
# bep42_r = 0

[index]
path = "/var/lib/dhtcrawler4/index"
writer_heap_bytes = 134217728
batch_size = 1000
poll_interval_ms = 1000

[web]
listen = "127.0.0.1:8080"
site_name = "dhtcrawler4"
# Send Strict-Transport-Security. Only enable when served exclusively over HTTPS.
hsts = false
# Reverse proxies whose X-Forwarded-For header is trusted (CIDR list). Behind
# Docker's published port this is the network the proxy connects from, not 127.0.0.1.
trusted_proxies = []
# How many (text, sort, page, per_page) index results the search query cache
# keeps (0 disables it).
search_cache_size = 100
# How long a search cache entry lives, in seconds, fixed from insert
# (0 disables it).
search_cache_ttl_secs = 900

[metrics]
# Prometheus endpoint for whichever role is running. Keep it off the public network.
listen = "127.0.0.1:9100"

[log]
# "json" or "pretty"
format = "json"
level = "info"
