services:
  crawl:
    environment:
      DC4_CRAWL__SAMPLER_CONCURRENCY: "256"
      DC4_CRAWL__MAX_PACKETS_PER_SEC: "6000"
      DC4_CRAWL__SCRAPE_SWEEP_SECS: "600"
      DC4_DATABASE__MAX_CONNECTIONS: "48"
      DC4_CRAWL__GAVE_UP_PURGE_HOURS: "0"
      DC4_CRAWL__MAX_PENDING: "2000000"
      DC4_CRAWL__REMOVAL_COOLDOWN_DAYS: "14"
      DC4_CRAWL__FETCH_WORKERS: "8192"
      DC4_CRAWL__TRACKER_TIMEOUT_SECS: "3"
      DC4_CRAWL__TRACKER_SCRAPE_FANOUT: "1"
      DC4_CRAWL__TRACKER_ANNOUNCES_PER_KEY: "2"
  web:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      DC4_WEB__SITE_NAME: "btdug"
      DC4_WEB__HSTS: "true"
      DC4_WEB__TRUSTED_PROXIES: "127.0.0.1, 172.30.80.0/24"
