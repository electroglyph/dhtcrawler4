[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/dc4-core",
    "crates/dc4-bencode",
    "crates/dc4-torrent",
    "crates/dc4-dht",
    "crates/dc4-peer",
    "crates/dc4-store",
    "crates/dc4-tracker",
    "crates/dc4-search",
    "crates/dc4-web",
    "crates/dhtcrawler4",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/electroglyph/dhtcrawler4"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[workspace.dependencies]
dc4-core = { path = "crates/dc4-core" }
dc4-bencode = { path = "crates/dc4-bencode" }
dc4-torrent = { path = "crates/dc4-torrent" }
dc4-dht = { path = "crates/dc4-dht" }
dc4-peer = { path = "crates/dc4-peer" }
dc4-store = { path = "crates/dc4-store" }
dc4-tracker = { path = "crates/dc4-tracker" }
dc4-search = { path = "crates/dc4-search" }
dc4-web = { path = "crates/dc4-web" }

anyhow = "1.0.104"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32c = "0.6.8"
data-encoding = "2.11.1"
encoding_rs = "0.8.41"
futures = "0.3.34"
hex = "0.4.3"
ipnet = "2.12.2"
lru = "0.18.2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
percent-encoding = "2.3"
proptest = "1.11.0"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono", "json"] }
tantivy = "0.26.2"
tempfile = "3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs"] }
tokio-util = "0.7.19"
toml = "0.9.12"
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7.1", features = ["set-header", "limit", "timeout", "trace", "catch-panic", "normalize-path"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"
